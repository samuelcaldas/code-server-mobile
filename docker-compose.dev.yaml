services:
  code-server-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: code-server-mobile:dev
    container_name: code-server-mobile-dev
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8080"
    environment:
      - TZ=America/Sao_Paulo
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - PASSWORD=${PASSWORD:-timoteo2026}
      - SUDO_PASSWORD=${SUDO_PASSWORD:-timoteo2026}
      - DEFAULT_WORKSPACE=/home/coder/workspace
    volumes:
      - code-server-dev-data:/home/coder
      - .:/home/coder/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  code-server-dev-data:
    driver: local
